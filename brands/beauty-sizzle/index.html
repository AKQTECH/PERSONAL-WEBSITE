<style>

  :root {
    --hot-pink: #ff89f0;
    --pale-pink: #ffd8f5;
    --chartreuse: #E1E977;
    --cream: #fdf8f2;
    --black: #111111;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
  }

  body {
    background: var(--pale-pink);
    color: var(--black);
    font-family: Arial, sans-serif;
  }

  .sizzle-page {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--pale-pink);
  }

  .sizzle-video {
    width: min(92vw, 620px);
    aspect-ratio: 9 / 16;
    background: var(--black);
    border: 3px solid var(--black);
    box-shadow: 10px 10px 0 var(--hot-pink);
    overflow: hidden;
  }

  .sizzle-video video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: var(--black);
  }

  .full-site-link {
    margin-top: 28px;
    padding: 12px 16px;
    border: 2px solid var(--black);
    background: var(--chartreuse);
    color: var(--black);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
    text-decoration: none;
    text-transform: uppercase;
    box-shadow: 4px 4px 0 var(--black);
    transition: transform .12s ease, box-shadow .12s ease;
  }

  .full-site-link:hover {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 var(--black);
  }

  @media (max-width: 600px) {

    .sizzle-page {
      padding: 14px;
      justify-content: center;
    }

    .sizzle-video {
      width: min(94vw, 520px);
      height: auto;
      box-shadow: 7px 7px 0 var(--hot-pink);
    }

    .full-site-link {
      margin-top: 20px;
      font-size: 10px;
    }

  }

</style>
